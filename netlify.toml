# Static deploy of the game. The Forge UI (web/index.html) needs the Node server
# and a Tripo key, so on Netlify the site root serves the game instead.
[build]
  publish = "web"
  # The game and the creator import /lib/forge.js and /lib/portrait.js; locally the Node server serves them from src/.
  command = "mkdir -p web/lib && cp src/forge.js src/portrait.js web/lib/"

[[redirects]]
  from = "/"
  to = "/game.html"
  status = 200
  force = true

[[redirects]]
  from = "/creator"
  to = "/creator.html"
  status = 200

[[redirects]]
  from = "/game"
  to = "/game.html"
  status = 200
